name: Weekly restaurant snapshot

# Every Monday at 14:00 UTC (10 AM Eastern), after the weekend's reviews are in.
# Can also be started by hand from the Actions tab ("Run workflow").
on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: pip install pandas requests

      - name: Take snapshot
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: python scripts/snapshot_places.py

      - name: Save snapshot to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots
          if git diff --cached --quiet; then
            echo "No new snapshot to save."
          else
            git commit -m "Weekly snapshot $(date -u +%F)"
            git push
          fi
